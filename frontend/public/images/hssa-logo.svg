<svg width="600" height="600" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <title>Humanities and Social Sciences Alive — logo mark</title>
  <defs>
    <clipPath id="hssDiscClip">
      <circle cx="120" cy="100" r="48"/>
    </clipPath>
  </defs>

  <!-- background disc -->
  <circle cx="120" cy="120" r="118" fill="#F5DED3"/>

  <!-- sun rays -->
  <g stroke="#C2522A" stroke-width="11" stroke-linecap="round">
    <line x1="120" y1="44" x2="120" y2="22"/>
    <line x1="159.6" y1="60.4" x2="175.15" y2="44.85"/>
    <line x1="176" y1="100" x2="198" y2="100"/>
    <line x1="80.4" y1="60.4" x2="64.85" y2="44.85"/>
    <line x1="64" y1="100" x2="42" y2="100"/>
  </g>

  <!-- sun / moon disc -->
  <g clip-path="url(#hssDiscClip)">
    <rect x="60" y="52" width="120" height="48" fill="#C2522A"/>
    <rect x="60" y="100" width="120" height="48" fill="#C9CDD1"/>
    <circle cx="100" cy="112" r="4.5" fill="#9DA3A8"/>
    <circle cx="140" cy="130" r="3.6" fill="#9DA3A8"/>
    <circle cx="118" cy="138" r="2.8" fill="#9DA3A8"/>
    <circle cx="150" cy="108" r="2.2" fill="#9DA3A8"/>
    <circle cx="95" cy="126" r="2" fill="#9DA3A8"/>
  </g>
  <line x1="72" y1="100" x2="168" y2="100" stroke="#F5DED3" stroke-width="2.5"/>

  <!-- bridge / open-book arch -->
  <path d="M66,150 Q120,205 174,150" fill="none" stroke="#1C1A17" stroke-width="12" stroke-linecap="round"/>

  <!-- deck -->
  <line x1="76" y1="220" x2="164" y2="220" stroke="#1C1A17" stroke-width="10" stroke-linecap="round"/>
  <line x1="86" y1="220" x2="86" y2="202" stroke="#1C1A17" stroke-width="10" stroke-linecap="round"/>
  <line x1="154" y1="220" x2="154" y2="202" stroke="#1C1A17" stroke-width="10" stroke-linecap="round"/>
</svg>
