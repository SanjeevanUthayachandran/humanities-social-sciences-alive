spring:
  application:
    name: Humanities & Social Sciences Alive
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.hssa: DEBUG

cors:
  allowed-origins: "*"
  allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: false
  max-age: 3600

swagger:
  server:
    url: http://localhost:8080

async:
  core-pool-size: 5
  max-pool-size: 10
  queue-capacity: 25

cache:
  type: simple

app:
  timezone: UTC

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000
      refresh-token:
        expiration: 604800000
